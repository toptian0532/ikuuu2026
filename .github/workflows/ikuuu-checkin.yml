name: IKUUU 自动签到

on:
  schedule:
    # 每天北京时间 9:00 执行（UTC 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'  # 缓存 pip 依赖

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Reason: 免费浏览器过 Geetest，需要 Chromium
        python -m playwright install --with-deps chromium

    - name: 验证依赖安装
      run: |
        echo "📦 已安装的包版本："
        pip list | grep -E "requests|beautifulsoup4|brotli|urllib3|playwright"

    - name: 执行签到
      run: |
        set -o pipefail
        SUCCESS=0
        for i in 1 2 3; do
          echo "===== 第 $i/3 次签到尝试 $(date '+%H:%M:%S') ====="
          if python main.py 2>&1 | tee "checkin_log_$i.txt"; then
            SUCCESS=1
            echo "✅ 第 $i 次尝试成功"
            break
          fi
          echo "⚠️ 第 $i 次尝试失败"
          # Reason: Geetest/Cloudflare 对 GitHub Actions IP 存在间歇性动态风控，
          # 瞬时失败通常等待后重试即可恢复，递增等待降低连续被拦概率
          if [ "$i" -lt 3 ]; then
            WAIT=$((i * 45))
            echo "等待 ${WAIT}s 后重试..."
            sleep $WAIT
          fi
        done
        if [ "$SUCCESS" -ne 1 ]; then
          echo "❌ 连续 3 次签到均失败"
          exit 1
        fi

    - name: 上传签到日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkin-logs
        path: checkin_log_*.txt
        retention-days: 7
        if-no-files-found: ignore

    - name: 更新域名缓存
      if: success()
      run: |
        if git diff --quiet domain.txt 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q "^domain.txt$"; then
          echo "ℹ️ 域名缓存无变化，跳过提交"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domain.txt
          git commit -m "自动更新域名缓存" || echo "ℹ️ 无需提交"
          git push || echo "⚠️ 推送失败，域名缓存将在下次运行时重新生成"
        fi

    - name: 签到结果通知
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ 签到成功！"
        else
          # Reason: 原实现用 $? 判断的是上一步（更新域名缓存）而非签到本身，已改为 job.status
          echo "❌ 签到失败，日志尾部如下："
          LAST_LOG=$(ls -t checkin_log_*.txt 2>/dev/null | head -1)
          if [ -n "$LAST_LOG" ]; then
            {
              echo ""
              echo "### ❌ 签到失败（最后一次尝试日志尾部 60 行：$LAST_LOG）"
              echo '```'
              tail -n 60 "$LAST_LOG"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "未找到签到日志文件（可能在依赖安装阶段即失败）"
          fi
          exit 1
        fi
